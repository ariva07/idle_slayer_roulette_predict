[package]
name = "roulette-predictor"
version = "0.1.1"
description = "Idle Slayer Roulette Predictor"
authors = ["Marian"]
license = "GNU GPL"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.2.0", features = [] }
